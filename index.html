<!DOCTYPE html>
<html lang="en">
<head><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#FF1493">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Vinyl Store</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #050507;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        .glassmorphism {
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }
        .image-container {
            width: 100%;
            height: 300px;
            background-image: url('https://picsum.photos/200/300');
            background-size: cover;
            background-position: center;
            border-radius: 20px;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="container mx-auto p-4 md:p-6 lg:p-10">
        <div class="flex flex-col items-center justify-center h-screen">
            <div class="glassmorphism max-w-md mx-auto p-6 md:p-8 lg:p-12">
                <h1 class="text-3xl font-bold mb-4">Luxury Vinyl Store</h1>
                <p class="text-lg mb-6">Welcome to our luxury vinyl store. Browse our collection of rare and unique vinyl records.</p>
                <div class="image-container mb-6"></div>
                <button class="bg-orange-500 hover:bg-orange-700 text-white font-bold py-2 px-4 rounded">Browse Collection</button>
            </div>
        </div>
    </div>
    <script>
        // Add event listener to button
        const button = document.querySelector('button');
        button.addEventListener('click', () => {
            // Add your JavaScript code here
            console.log('Button clicked!');
        });
    </script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script></body>
</html>


This code creates a basic luxury vinyl store website with a dark theme, glassmorphism effect, and a working button. You can customize the HTML, CSS, and JavaScript to fit your needs.
